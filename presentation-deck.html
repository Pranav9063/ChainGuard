                    ## **Modernizing Container Security**
                    #### Moving from Bloat to Distroless Zero-CVE Architecture

                    *Chainguard Solutions Engineer Challenge*
                    
                    **[Candidate: Pranav]**
                </textarea>
            </section>

            <!-- Slide 2: Environment -->
            <section data-markdown>
                <textarea data-template>
                    ## 1. Environment & Architecture
                    
                    *   **OS Level:** Windows / WSL2
                        *   *Why?* Native kernel integration for Docker without standalone VM overhead.
                    *   **Local Cluster:** `kind` (Kubernetes IN Docker)
                        *   *Why?* Hyper-lightweight, spins up in seconds, matches production routing topologies.
                    *   **Local Registry:** `registry:2` port 5000
                        *   *Why?* Empowers fully disconnected, zero-credential supply chain simulation.
                </textarea>
            </section>

            <!-- Slide 3: Toolchain -->
            <section data-markdown>
                <textarea data-template>
                    ## Secure Toolchain
                    
                    *   **Vulnerability Scanner:** `grype`
                        *   Anchore's high-speed engine specifically tailored for isolated app layer reads.
                    *   **SBOM Generation:** `syft`
                        *   Exports cleanly into SPDX-2.3 JSON to track every dependency down to the standard library.
                    *   **Cryptographic Signing:** `cosign`
                        *   Sigstore signature framework mapping transparent immutable identity to deployments.
                </textarea>
            </section>

            <!-- Slide 4: Migration Strategy -->
            <section data-markdown>
                <textarea data-template>
                    ## 2. Dockerfile Design Dive
                    
                    We built three distinct iterations showing the structural flaws in legacy designs vs modern distroless practices.
                    
                    1.  **Baseline Target:** `golang:1.25`
                    2.  **Alpine Sandbox:** Multi-stage to `alpine:3.21`
                    3.  **The Solution:** Multi-stage to `cgr.dev/chainguard/static`
                </textarea>
            </section>

            <!-- Slide 5: Vulnerability Metrics -->
            <section data-markdown>
                <textarea data-template>
                    ## The Metric Shift

                    | Factor | 1. Baseline | 2. Alpine | 3. Distroless |
                    | :--- | :--- | :--- | :--- |
                    | **Size** | 1.8 GB 🔴 | 32 MB 🟡 | **26 MB 🟢** |
                    | **Total CVEs** | **756 🔴** | **4 🟡** | **0 Known CVEs 🟢** |
                    | **App. Patch** | None | None | None |
                    | **Terminal**| Base OS `apt`| Base OS `apk`| **None isolated**|

                    *The reduction drops the security "chase overhead" to zero.*
                </textarea>
            </section>

            <!-- Slide 6: Remediation Narrative -->
            <section data-markdown>
                <textarea data-template>
                    ## Security Remediation Narrative

                    Instead of placing hundreds of OS vulnerabilities on a "patching treadmill"... We **removed the OS**.

                    *   Our app (Gin-framework) had perfectly patched packages natively.
                    *   Vulnerabilities like *CVE-2023-4911* mapped to standard OS tooling.
                    *   Going Distroless completely **erased** the exploit vector because the underlying filesystem simply abandons the tooling (`bash`, `python`) entirely.
                </textarea>
            </section>

            <!-- Slide 7: Supply Chain -->
            <section data-markdown>
                <textarea data-template>
                    ## 3. Supply Chain Verification
                    
                    Security is useless if the image payload is switched *after* the build.

                    1.  **Generate Signature:** `cosign generate-key-pair`
                    2.  **Immutability:** Each image is signed before registry push.
                    3.  **Traceability:** `syft` SBOM tracks exactly what sub-processes survived our multi-stage build.

                    *This creates a fully trusted loop from IDE to Kubernetes Node.*
                </textarea>
            </section>

            <!-- Slide 8: K8s and Prod -->
            <section data-markdown>
                <textarea data-template>
                    ## 4. Kubernetes Defense
                    
                    Our application isn't just minimal—it maps securely to the orchestrator.

                    **`k8s-deployment.yaml`** Security Context:
                    ```yaml
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532  # explicit tracking
                      readOnlyRootFilesystem: true
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - ALL
                    ```
                    Blast-radius mitigation fully deployed.
                </textarea>
            </section>
